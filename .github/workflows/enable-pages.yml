name: Enable GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Attempting to create Pages site (legacy, main /)..."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f build_type='legacy' \
            -f source[branch]='main' \
            -f source[path]='/'
          post_code=$?
          echo "POST exit=$post_code"
          if [ "$post_code" -ne 0 ]; then
            echo "POST failed; attempting PUT update..."
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f build_type='legacy' \
              -f source[branch]='main' \
              -f source[path]='/'
            echo "PUT exit=$?"
          fi
          echo "Current Pages config:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" -H "Accept: application/vnd.github+json" || true
