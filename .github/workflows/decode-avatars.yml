name: Decode avatars
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 avatars and commit JPEGs
        run: |
          set -euo pipefail
          if [ ! -d avatars-b64 ]; then
            echo "No avatars-b64 directory; nothing to decode"
            exit 0
          fi
          mkdir -p avatars
          count=0
          for f in avatars-b64/*.b64; do
            [ -f "$f" ] || continue
            dest="avatars/$(basename "$f" .b64)"
            base64 -d "$f" > "$dest"
            python3 -c "import sys; d=open(sys.argv[1],'rb').read(3); assert d==b'\xff\xd8\xff', 'not a jpeg: '+sys.argv[1]" "$dest"
            echo "decoded $dest ($(wc -c < "$dest") bytes)"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "No .b64 files found"
            exit 0
          fi
          rm -rf avatars-b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A avatars avatars-b64
          git commit -m "Add decoded avatar JPEG images"
          git push
